# Every push and pull request: run the tests, then build the installer to prove
# the build still works.
#
# A push to master additionally publishes a GitHub Release - tagged
# v<src.__version__>, with the installer attached - unless that version has
# already been released. So shipping is: bump __version__, push. Pushes that
# leave the version alone (docs, refactors) build but do not release, since a
# release is what installed copies update from.
name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # creating the tag and the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Read the version
        id: version
        run: |
          $version = python -c "import src; print(src.__version__)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "src.__version__ = '$version' is not X.Y.Z"
          }
          $released = git ls-remote --tags origin "refs/tags/v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "new=$(if ($released) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      - name: Build exe and installer
        run: python tools/build_exe.py

      - name: Publish release
        if: github.event_name == 'push' && steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/AppySetup.exe
          generate_release_notes: true

      - name: Already released
        if: github.event_name == 'push' && steps.version.outputs.new == 'false'
        run: Write-Output "::notice::v${{ steps.version.outputs.version }} is already released. Bump __version__ in src/__init__.py to publish a new one."
